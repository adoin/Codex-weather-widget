[package]
name = "codex-calendar"
version = "1.1.2"
edition = "2024"
description = "A calm desktop calendar for live Codex quota and activity"
license = "MIT"
repository = "https://github.com/adoin/Codex-weather-widget"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
eframe = { version = "0.36.1", features = ["wgpu", "glow"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "gzip", "json", "query", "rustls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
sys-locale = "0.3.2"
tiny_http = "0.12.0"
tray-icon = "0.24.2"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
